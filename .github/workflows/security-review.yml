name: Security Review & SAST Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-review:
    runs-on: ubuntu-latest
    name: Security Review & Zero-Critical Policy Gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Web Frontend Security Review
        run: |
          node scripts/generateWebSecuritySuite.js

      - name: Run Backend Security Review
        run: |
          node backend/scripts/generateSecuritySuite.js

      - name: Enforce Zero-Critical Policy Gate
        run: |
          CRITICAL_WEB=$(grep -c "Critical Vulnerabilities: 0" web-security-review.md || true)
          CRITICAL_BE=$(grep -c "Critical Vulnerabilities: 0" security-review.md || true)
          
          if [ "$CRITICAL_WEB" -eq 0 ] || [ "$CRITICAL_BE" -eq 0 ]; then
            echo "❌ Security Policy Gate Failed: Critical vulnerabilities found!"
            exit 1
          else
            echo "✅ Zero-Critical Security Policy Enforced Successfully!"
          fi
